/crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0
      motion_capture:
        warning_if_rate_outside: [80.0, 120.0]
      communication:
        max_unicast_latency: 10.0
        min_unicast_ack_rate: 0.9
        min_unicast_receive_rate: 0.9
        min_broadcast_receive_rate: 0.9
        publish_stats: false
    firmware_params:
      query_all_values_on_connect: False
    sim:
      max_dt: 0
      backend: np
      visualizations:
        rviz:
          enabled: false
        pdf:
          enabled: false
          output_file: "result.pdf"
        record_states:
          enabled: true
          output_dir: "state_omar_indi_rust"
          logging_time: 0.05
          file_formats: ["csv", "np"]
        blender:
          enabled: false
          fps: 1
          cycle_bg: false
          cf_cameras: {}
      # controller=10 (omar_indi_rust.rs) — Rust port of controller_omar_indi.c; indi=3 at Init.
      controller: oot5
