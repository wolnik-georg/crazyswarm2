/motion_capture_tracking:
  ros__parameters:
    # one of "optitrack", "optitrack_closed_source", "vicon", "qualisys", "nokov", "vrpn", "motionanalysis"
    type: "optitrack"
    # Specify the hostname or IP of the computer running the motion capture software
    hostname: "141.23.110.143"

    topics:
      frame_id: "mocap"
      poses:
        qos:
          mode: "sensor"
          deadline: 100.0 # Hz
      tf:
        child_frame_id: "{}_mocap"

    marker_configurations:
      default: # for standard Crazyflie
        offset: [0.0, 0.0, 0.0]
        points:
          p0: [   0.0,    0.0, 0.022]  # top
          p1: [-0.042,  0.042, 0.0  ]  # back left   (M3)
          p2: [-0.042, -0.042, 0.0  ]  # back right  (M2)
          p3: [ 0.042, -0.042, 0.0  ]  # front right (M1)
      default_single_marker:
        offset: [0.0, -0.01, -0.04]
        points:
          p0: [0.0177184,0.0139654,0.0557585]
      mocap_deck:
        offset: [0.0, 0.0, -0.01]
        points:
          p0: [0.03, 0.0, 0.0] # front
          p1: [0.00, -0.03, 0.0] # right
          p2: [-0.015, 0.0, 0.0] # back
          p3: [0.00, 0.03, 0.0] # left
      # 2026-09-19: RECOVERED from a dangling git blob (never committed to any branch in this
      # repo, predates this repo's own history -- see debug/lab_logs/find_active_deck_geometry.sh
      # and docs/lab_sessions/2026-09-19.md). Used by robot_types.cf21_active below. A real
      # 4-point rigid pattern for librigidbodytracker to match, unlike default_single_marker's
      # single point -- a single point has nothing to disambiguate itself from any other marker
      # in the volume (including the other drone's), which is the leading hypothesis for the
      # 2026-09-18/19 close-proximity tracking failures (A1 hover, A8's pre-fix crashes).
      # NOT YET APPLIED to any robot -- cf231_active is still `type: cf21` pending physical
      # verification that a 4-marker deck in exactly this front-left/front-right/back-left/
      # back-right square pattern is actually mounted.
      active_deck:
        offset: [0.0, 0.0, -0.02]
        points:
          p0: [-0.019, 0.019, 0.0] # front left (M4)
          p1: [0.019, 0.019, 0.0] # front right (M1)
          p2: [-0.019, -0.019, 0.0] # back left (M3)
          p3: [0.019, -0.019, 0.0] # back right (M2)
      medium_frame:
        offset: [0.0, 0.0, -0.03]
        points:
          p0: [-0.00896228,-0.000716753,0.0716129]
          p1: [-0.0156318,0.0997402,0.0508162]
          p2: [0.0461693,-0.0881012,0.0380672]
          p3: [-0.0789959,-0.0269793,0.0461144]
      big_frame:
        offset: [0.0, 0.0, -0.06]
        points:
          p0: [0.0558163,-0.00196302,0.0945539]
          p1: [-0.0113941,0.00945842,0.0984811]
          p2: [-0.0306277,0.0514879,0.0520456]
          p3: [0.0535816,-0.0400775,0.0432799]

    dynamics_configurations:
      default:
        max_velocity: [2, 2, 3] # m/s
        max_angular_velocity: [20, 20, 10] # rad/s
        max_roll: 1.4 #rad
        max_pitch: 1.4 #rad
        max_fitness_score: 0.001

    # Rigid bodies will be automatically generated by the launch file
    # rigid_bodies: