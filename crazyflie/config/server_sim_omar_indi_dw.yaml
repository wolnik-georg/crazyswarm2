/crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0 # report/run checks once per second
      motion_capture:
        warning_if_rate_outside: [80.0, 120.0]
      communication:
        max_unicast_latency: 10.0 # ms
        min_unicast_ack_rate: 0.9
        min_unicast_receive_rate: 0.9 # requires status topic to be enabled
        min_broadcast_receive_rate: 0.9 # requires status topic to be enabled
        publish_stats: false
    firmware_params:
      query_all_values_on_connect: False
    # simulation related
    sim:
      max_dt: 0 #0.1              # artificially limit the step() function (set to 0 to disable)
      backend: neuralswarm   # downwash model -- controller=9 (controller_omar_indi.c) downwash
                              # test, 2026-09-23. ~4x slower than real time; any client MUST
                              # pass --ros-args -p use_sim_time:=true (docs/09_Simulation.md) or
                              # its wall-clock-paced sleeps outrun the sim and every stage gets
                              # cut short -- confirmed for every other controller already, not
                              # specific to this one.
      visualizations:             # see visualization folder for a list
        rviz:
          enabled: false          # headless
        pdf:
          enabled: false
          output_file: "result.pdf"
        record_states:
          enabled: true
          output_dir: "state_omar_indi_dw"
          logging_time: 0.05
          file_formats: ["csv", "np"] # csv, np
        blender:
          enabled: false
          fps: 1
          cycle_bg: false
          cf_cameras: {}
      # controller=9 -- see server_sim_omar_indi.yaml for full controller notes.
      # Use crazyflies_sim.yaml (2 robots) or crazyflies_sim3.yaml (3 robots) with this file;
      # sim.controller is global across every vehicle in the run.
      controller: oot4
