/crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0 # report/run checks once per second
      motion_capture:
        warning_if_rate_outside: [80.0, 120.0]
      communication:
        max_unicast_latency: 10.0 # ms
        min_unicast_ack_rate: 0.9
        min_unicast_receive_rate: 0.9 # requires status topic to be enabled
        min_broadcast_receive_rate: 0.9 # requires status topic to be enabled
        publish_stats: false
    firmware_params:
      query_all_values_on_connect: False
    # simulation related
    sim:
      max_dt: 0 #0.1              # artificially limit the step() function (set to 0 to disable)
      backend: np   # no interaction model -- single-drone smoke test, no downwash to model
      visualizations:             # see visualization folder for a list
        rviz:
          enabled: false          # headless: this run is a numerical smoke test, not a demo
        pdf:
          enabled: false
          output_file: "result.pdf"
        record_states:
          enabled: true
          output_dir: "state_naindi_hybrid"
          logging_time: 0.05
          file_formats: ["csv", "np"] # csv, np
        blender:
          enabled: false
          fps: 1
          cycle_bg: false
          cf_cameras: {}
      # controller=8 (naindi_hybrid.rs) -- faithful, numerically-verified NA-INDI port
      # with use_nn=1 (their real trained network, own-state-only input -- see the
      # module's own doc for why this does NOT compensate this thesis's interaction
      # force). No ctrl_mode, same reasoning as server_sim_naindi.yaml. First run
      # through this closed-loop simulator; only ever run through host-level static
      # test vectors before (test_naindi_hybrid_reference.py). 2026-09-18: naindi_hybrid.rs
      # now has its own per-vehicle state-swap (naindi_hybrid_select_drone, mirrors
      # controllerOutOfTree's oot_select_drone) -- multiple robots are fine; use
      # crazyflies_sim.yaml for 2. This file still defaults to crazyflies_sim1.yaml (1
      # robot) and backend: np (no downwash model) as the cheapest smoke test.
      controller: oot3
