/crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0 # report/run checks once per second
      motion_capture:
        warning_if_rate_outside: [80.0, 120.0]
      communication:
        max_unicast_latency: 10.0 # ms
        min_unicast_ack_rate: 0.9
        min_unicast_receive_rate: 0.9 # requires status topic to be enabled
        min_broadcast_receive_rate: 0.9 # requires status topic to be enabled
        publish_stats: false
    firmware_params:
      query_all_values_on_connect: False
    # simulation related
    sim:
      max_dt: 0 #0.1              # artificially limit the step() function (set to 0 to disable)
      backend: np   # no interaction model -- single-drone smoke test, no downwash to model
      visualizations:             # see visualization folder for a list
        rviz:
          enabled: false          # headless: this run is a numerical smoke test, not a demo
        pdf:
          enabled: false
          output_file: "result.pdf"
        record_states:
          enabled: true
          output_dir: "state_omar_indi"
          logging_time: 0.05
          file_formats: ["csv", "np"] # csv, np
        blender:
          enabled: false
          fps: 1
          cycle_bg: false
          cf_cameras: {}
      # controller=9 (controller_omar_indi.c) -- a LITERAL C copy of the supervisor's own
      # controller_lee.c (crazyflie-firmware-omar), numerically verified bit-for-bit against
      # his compiled build (6/6 test vectors, d=0.00e+00 -- host/test_omar_indi_reference.py,
      # docs/41_Pure_INDI_Implementation_Comparison.md §8). No ctrl_mode: indi=3 is set once at
      # Init in crazyflie_sil.py, not a runtime selector. First run through this closed-loop
      # simulator; only ever run through static test vectors before. No per-vehicle state-swap
      # needed (unlike oot2/oot3) -- controllerOmarIndi() takes an explicit self struct, so
      # multiple robots are fine out of the box; use crazyflies_sim.yaml for 2. This file still
      # defaults to crazyflies_sim1.yaml (1 robot) and backend: np (no downwash model) as the
      # cheapest smoke test.
      controller: oot4
