/crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0 # report/run checks once per second
      motion_capture:
        warning_if_rate_outside: [80.0, 120.0]
      communication:
        max_unicast_latency: 10.0 # ms
        min_unicast_ack_rate: 0.9
        min_unicast_receive_rate: 0.9 # requires status topic to be enabled
        min_broadcast_receive_rate: 0.9 # requires status topic to be enabled
        publish_stats: false
    firmware_params:
      query_all_values_on_connect: False
    # simulation related
    sim:
      max_dt: 0 #0.1              # artificially limit the step() function (set to 0 to disable)
      backend: np   # no interaction model -- single/2-drone smoke test, no downwash to model
      visualizations:             # see visualization folder for a list
        rviz:
          enabled: false          # headless
        pdf:
          enabled: false
          output_file: "result.pdf"
        record_states:
          enabled: true
          output_dir: "state_lee"
          logging_time: 0.05
          file_formats: ["csv", "np"] # csv, np
        blender:
          enabled: false
          fps: 1
          cycle_bg: false
          cf_cameras: {}
      # Stock geometric SE(3) (controller_lee.c, mainline crazyflie-firmware,
      # ControllerTypeLee=5) -- cf_second's permanent real-hardware pin, never before run
      # through this SIL. Added 2026-09-18 as a third-party sanity baseline for the strategy
      # comparison: isolates whether an issue with our own geometric (controller=6,
      # ctrl_mode=0) is specific to our implementation or general to the control law.
      controller: lee
