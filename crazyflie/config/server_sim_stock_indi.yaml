/crazyflie_server:
  ros__parameters:
    warnings:
      frequency: 1.0 # report/run checks once per second
      motion_capture:
        warning_if_rate_outside: [80.0, 120.0]
      communication:
        max_unicast_latency: 10.0 # ms
        min_unicast_ack_rate: 0.9
        min_unicast_receive_rate: 0.9 # requires status topic to be enabled
        min_broadcast_receive_rate: 0.9 # requires status topic to be enabled
        publish_stats: false
    firmware_params:
      query_all_values_on_connect: False
    # simulation related
    sim:
      max_dt: 0 #0.1              # artificially limit the step() function (set to 0 to disable)
      backend: np   # no interaction model -- single-drone smoke test, no downwash to model
      visualizations:             # see visualization folder for a list
        rviz:
          enabled: false          # headless: this run is a numerical smoke test, not a demo
        pdf:
          enabled: false
          output_file: "result.pdf"
        record_states:
          enabled: true
          output_dir: "state_stock_indi"
          logging_time: 0.05
          file_formats: ["csv", "np"] # csv, np
        blender:
          enabled: false
          fps: 1
          cycle_bg: false
          cf_cameras: {}
      # Bitcraze's OWN stock INDI (controller_indi.c + position_controller_indi.c,
      # mainline crazyflie-firmware, ControllerTypeINDI=3) -- a THIRD, structurally
      # different INDI from both this project's own (lib.rs) and the Cobo-Briesewitz
      # port (naindi.rs/controller=7). Wired into crazyflie_sil.py 2026-09-18 as a
      # reference point for the controller=7 SIL investigation (docs/07): flew clean
      # on real hardware with no oscillation (worse tracking than either of the other
      # two), so a clean/crashed result here tells us whether the SIL itself has a
      # sim-vs-reality gap, independent of naindi.rs's own port.
      controller: indi
